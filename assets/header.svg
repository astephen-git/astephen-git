<svg viewBox="0 0 1200 290" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Back layer: arches UP in the middle, dips down at the edges -->
    <path id="waveBack" d="M0,0 L1200,0 L1200,230
           C900,230 900,190 600,190
           C300,190 300,230 0,230
           Z"/>

    <!-- Front layer: dips DOWN in the middle, rises at the edges (inverse of back) -->
    <path id="waveFront" d="M0,0 L1200,0 L1200,200
           C900,200 900,245 600,245
           C300,245 300,200 0,200
           Z"/>

    <clipPath id="clipLine1">
      <rect x="330" y="140" width="0" height="34">
        <animate attributeName="width"
          keyTimes="0;0.001;0.19;0.30;1"
          values="0;0;540;540;540"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clipLine2">
      <rect x="257" y="140" width="0" height="34">
        <animate attributeName="width"
          keyTimes="0;0.333;0.334;0.52;0.63;1"
          values="0;0;0;685;685;685"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clipLine3">
      <rect x="310" y="140" width="0" height="34">
        <animate attributeName="width"
          keyTimes="0;0.667;0.668;0.85;0.96;1"
          values="0;0;0;580;580;580"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Back wave: solid LIGHT color, crisp -->
  <g fill="#9b6fd6">
    <use href="#waveBack" x="0" y="0"/>
    <use href="#waveBack" x="1200" y="0"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -1200,0" dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- Front wave: lighter dark tone, frosted glass blur, SAME timing as back so they stay in sync -->
  <g filter="url(#glassBlur)" fill="#5c3a8c" opacity="0.72">
    <use href="#waveFront" x="0" y="0"/>
    <use href="#waveFront" x="1200" y="0"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -1200,0" dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- Glass highlight sheen along the front wave's crest -->
  <g filter="url(#glassBlur)" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.2">
    <use href="#waveFront" x="0" y="0"/>
    <use href="#waveFront" x="1200" y="0"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -1200,0" dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- Title -->
  <text x="600" y="112" text-anchor="middle"
        font-family="'Trebuchet MS', Verdana, sans-serif" font-weight="bold"
        font-size="58" fill="#E8DFFF" opacity="0">
    Stephen A
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Typing line 1 -->
  <g opacity="0">
    <animate attributeName="opacity"
      keyTimes="0;0.001;0.28;0.333;1"
      values="0;1;1;0;0"
      dur="12s" repeatCount="indefinite"/>
    <g clip-path="url(#clipLine1)">
      <text x="330" y="164" font-family="'Fira Code', monospace" font-size="24" fill="#B389FF">Security Operations | Threat Hunting</text>
    </g>
    <rect x="866" y="143" width="10" height="26" fill="#B389FF">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Typing line 2 -->
  <g opacity="0">
    <animate attributeName="opacity"
      keyTimes="0;0.333;0.334;0.61;0.667;1"
      values="0;0;1;1;0;0"
      dur="12s" repeatCount="indefinite"/>
    <g clip-path="url(#clipLine2)">
      <text x="257" y="164" font-family="'Fira Code', monospace" font-size="24" fill="#B389FF">Detection Engineering | Splunk | MITRE ATT&amp;CK</text>
    </g>
    <rect x="938" y="143" width="10" height="26" fill="#B389FF">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Typing line 3 -->
  <g opacity="0">
    <animate attributeName="opacity"
      keyTimes="0;0.667;0.668;0.94;0.999;1"
      values="0;0;1;1;0;0"
      dur="12s" repeatCount="indefinite"/>
    <g clip-path="url(#clipLine3)">
      <text x="310" y="164" font-family="'Fira Code', monospace" font-size="24" fill="#B389FF">Blue Team | Applied AI Security Tooling</text>
    </g>
    <rect x="886" y="143" width="10" height="26" fill="#B389FF">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
